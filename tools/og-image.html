<!doctype html><meta charset="utf-8"><title>Share card source</title>
<!-- Source for assets/img/og-image.png. Render at 1200x630, e.g. Chrome headless --window-size=1200,630 --screenshot -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,900,100,1&display=block">
<style>
:root{--cream:#FDF8F0;--terracotta:#B0533C;--mustard:#D9A441;--sage:#B9C3A0;--blush:#F2D3C2;--cocoa:#3B2218;}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:var(--cream);color:var(--cocoa);font-family:"DM Sans",sans-serif}
.f{font-family:"Fraunces",Georgia,serif;font-weight:900;font-variation-settings:"SOFT" 100,"WONK" 1;text-transform:lowercase;line-height:1;letter-spacing:-0.01em}
.label{font-size:22px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--terracotta)}
.frame{border-radius:36px;overflow:hidden;background:var(--blush)}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
</style>
<style>body{display:flex;align-items:center;justify-content:center;gap:18px;background-color:var(--cream);
background-image:linear-gradient(90deg,rgba(150,165,120,.5) 50%,transparent 50%),linear-gradient(rgba(150,165,120,.5) 50%,transparent 50%);background-size:60px 60px}
.plate{width:500px;height:500px;border-radius:50%;background:var(--cream);display:flex;align-items:center;justify-content:center;text-align:center;
box-shadow:0 16px 40px rgba(59,34,24,.3), inset 0 0 0 26px var(--cream), inset 0 0 0 29px rgba(95,109,64,.4)}
h1{font-size:90px;color:var(--terracotta)}
svg{width:44px;height:380px;filter:drop-shadow(0 8px 12px rgba(59,34,24,.3))}</style>
<div class="plate"><h1 class="f">cooking<br>with<br>sundi</h1></div>
